services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlingo}
      POSTGRES_USER: ${POSTGRES_USER:-mlingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlingo} -d ${POSTGRES_DB:-mlingo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mlingo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mlingo}
      MLINGO_ALLOWED_ORIGIN: ${MLINGO_ALLOWED_ORIGIN:-https://${SITE_DOMAIN}}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-https://${SITE_DOMAIN}/api/auth/github/callback}
      GITHUB_OAUTH_SCOPES: ${GITHUB_OAUTH_SCOPES:-read:user user:email public_repo}
      GITHUB_SOLUTIONS_REPO_NAME: ${GITHUB_SOLUTIONS_REPO_NAME:-mlingo-solutions}
      MLINGO_RUNNER_CONCURRENCY: ${MLINGO_RUNNER_CONCURRENCY:-1}
      MLINGO_RUNNER_TIMEOUT_SECONDS: ${MLINGO_RUNNER_TIMEOUT_SECONDS:-12}
      MLINGO_RUNNER_QUEUE_TIMEOUT_SECONDS: ${MLINGO_RUNNER_QUEUE_TIMEOUT_SECONDS:-120}
      MLINGO_RUNNER_MEMORY_MB: ${MLINGO_RUNNER_MEMORY_MB:-1536}
      PORT: 4180
    expose:
      - "4180"

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
